Description: "(SO0146) v1.1.0: Video on Demand on AWS Foundation Solution Implementation"
Mappings:
  Send:
    AnonymousUsage:
      Data: 'Yes'
Parameters:
  WebhookAuthorizationUrl:
    Type: String
    Default: WebhookAuthorizationUrl
    Description: Url of the webhook for status updates on video transformations
  WebhookAuthorizationKey:
    Type: String
    Default: WebhookAuthorizationKey
    Description: Either a static key or a cloudformation placeholder {{resolve:secretsmanager:arn:aws:secretsmanager:<region>:<account_id>:secret:secret_key_name}}
Resources:
  SourceS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName:
          Ref: LogsBucket
        LogFilePrefix: source-bucket-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W51
          reason: source bucket is private and does not require a bucket policy
      AWS::CloudFormation::Designer:
        id: eaa6fe77-0800-44f2-8b1a-c7f646e73b1e
  DestinationS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - "*"
          AllowedMethods:
          - GET
          AllowedOrigins:
          - "*"
          MaxAge: 3000
      LoggingConfiguration:
        DestinationBucketName:
          Ref: LogsBucket
        LogFilePrefix: destination-bucket-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: VodFoundation/Destination/Resource
      AWS::CloudFormation::Designer:
        id: 0ddd19cb-8841-4b2f-94ec-cb13d14b8eaa
  DestinationS3BucketCloudfrontPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DestinationS3Bucket
      PolicyDocument:
        Statement:
        - Sid: AllowCloudFrontServicePrincipalReadOnly
          Effect: Allow
          Action: s3:GetObject
          Principal:
            Service: cloudfront.amazonaws.com
          Resource:
            Fn::Join:
            - ''
            - - Fn::GetAtt:
                - DestinationS3Bucket
                - Arn
              - "/*"
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudfrontVideoDistribution}
        Version: '2012-10-17'
    DependsOn:
    - CloudfrontVideoDistribution
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: F16
          reason: Public website bucket policy requires a wildcard principal
      AWS::CloudFormation::Designer:
        id: 0ecbc66c-73e3-4eee-970c-5c0f72673f5d
  CloudFrontCloudfrontLoggingBucketE23C521E:
    Type: AWS::S3::Bucket
    Properties:
      #AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W35
          reason: This S3 bucket is used as the access logging bucket for CloudFront
            Distribution
      AWS::CloudFormation::Designer:
        id: '059b885e-5b2c-4036-9a60-f804e2a8fba2'
  CloudFrontCloudfrontLoggingBucketPolicyD60AA01A:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: CloudFrontCloudfrontLoggingBucketE23C521E
      PolicyDocument:
        Statement:
        - Action: "*"
          Condition:
            Bool:
              aws:SecureTransport: 'false'
          Effect: Deny
          Principal: "*"
          Resource:
            Fn::Join:
            - ''
            - - Fn::GetAtt:
                - CloudFrontCloudfrontLoggingBucketE23C521E
                - Arn
              - "/*"
          Sid: HttpsOnly
        Version: '2012-10-17'
    Metadata:
      aws:cdk:path: VodFoundation/CloudFront/CloudfrontLoggingBucket/Policy/Resource
      AWS::CloudFormation::Designer:
        id: 614e9e66-c682-4a14-9b66-66fd74de43bc
  CloudfrontVideoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment:
          Fn::Join:
          - ''
          - - Ref: AWS::StackName
            - " Video on Demand Foundation"
        DefaultCacheBehavior:
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: VodFoundationCloudFrontCloudFrontDistributionOrigin1F191A578
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Logging:
          Bucket:
            Fn::GetAtt:
            - CloudFrontCloudfrontLoggingBucketE23C521E
            - RegionalDomainName
        Origins:
        - DomainName:
            Fn::GetAtt:
            - DestinationS3Bucket
            - RegionalDomainName
          Id: VodFoundationCloudFrontCloudFrontDistributionOrigin1F191A578
          S3OriginConfig:
            OriginAccessIdentity: ''
          OriginAccessControlId:
            Fn::GetAtt:
            - CloudfrontVideoDistributionOriginAccessControl
            - Id
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W70
          reason: Since the distribution uses the CloudFront domain name, CloudFront
            automatically sets the security policy to TLSv1 regardless of the value
            of MinimumProtocolVersion
      AWS::CloudFormation::Designer:
        id: 5994eb2f-7ee1-4eaa-b38b-37b90fe41565
  MediaConvertRole031A64A9:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: mediaconvert.amazonaws.com
        Version: '2012-10-17'
    Metadata:
      aws:cdk:path: VodFoundation/MediaConvertRole/Resource
      AWS::CloudFormation::Designer:
        id: 69fbb333-b01f-49fe-aca5-39f5a61fb2ff
  MediaconvertPolicy9E3026EC:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
        - Action:
          - s3:GetObject
          - s3:PutObject
          Effect: Allow
          Resource:
          - Fn::Join:
            - ''
            - - Fn::GetAtt:
                - SourceS3Bucket
                - Arn
              - "/*"
          - Fn::Join:
            - ''
            - - Fn::GetAtt:
                - DestinationS3Bucket
                - Arn
              - "/*"
        - Action: execute-api:Invoke
          Effect: Allow
          Resource:
            Fn::Join:
            - ''
            - - 'arn:'
              - Ref: AWS::Partition
              - ":execute-api:"
              - Ref: AWS::Region
              - ":"
              - Ref: AWS::AccountId
              - ":*"
        Version: '2012-10-17'
      PolicyName: MediaconvertPolicy9E3026EC
      Roles:
      - Ref: MediaConvertRole031A64A9
    Metadata:
      aws:cdk:path: VodFoundation/MediaconvertPolicy/Resource
      AWS::CloudFormation::Designer:
        id: 65fa7f10-9fc8-471c-a120-c13fcc24bca4
  MediaConvertJobSettingsTemplate:
    Type: AWS::MediaConvert::JobTemplate
    Properties:
      AccelerationSettings:
        Mode: PREFERRED
      Description: Basic Video Transformation Settings from Appetiser Apps
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-JobSettingsTemplate"
      StatusUpdateInterval: SECONDS_60
      SettingsJson:
        TimecodeConfig:
          Source: ZEROBASED
        OutputGroups:
        - CustomName: cmaf
          Name: CMAF
          Outputs:
          - ContainerSettings:
              Container: CMFC
            VideoDescription:
              CodecSettings:
                Codec: H_264
                H264Settings:
                  MaxBitrate: 5000000
                  RateControlMode: QVBR
                  SceneChangeDetect: TRANSITION_DETECTION
            NameModifier: _h264
          - ContainerSettings:
              Container: CMFC
            AudioDescriptions:
            - AudioSourceName: Audio Selector 1
              CodecSettings:
                Codec: AAC
                AacSettings:
                  Bitrate: 96000
                  CodingMode: CODING_MODE_2_0
                  SampleRate: 48000
            NameModifier: _aac
          - ContainerSettings:
              Container: CMFC
            VideoDescription:
              CodecSettings:
                Codec: H_265
                H265Settings:
                  MaxBitrate: 2500000
                  RateControlMode: QVBR
                  SceneChangeDetect: TRANSITION_DETECTION
            NameModifier: _h265
          OutputGroupSettings:
            Type: CMAF_GROUP_SETTINGS
            CmafGroupSettings:
              SegmentLength: 10
              Destination:
                Fn::Sub: s3://${DestinationS3Bucket}/
              DestinationSettings:
                S3Settings:
                  Encryption:
                    EncryptionType: SERVER_SIDE_ENCRYPTION_S3
              FragmentLength: 2
        Inputs:
        - AudioSelectors:
            Audio Selector 1:
              DefaultSelection: DEFAULT
          VideoSelector: {}
          TimecodeSource: ZEROBASED
    Metadata:
      AWS::CloudFormation::Designer:
        id: 1fbba4f3-578b-420b-b797-81478406e771
  EventTriggerEventsRuleMediaConvertStatusUpdate:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
        - aws.mediaconvert
        detail:
          userMetadata:
            StackName:
            - Ref: AWS::StackName
          status:
          - COMPLETE
          - ERROR
          - CANCELED
          - INPUT_INFORMATION
          - STATUS_UPDATE
          - PROGRESSING
      State: ENABLED
      Targets:
      - RoleArn:
          Fn::GetAtt:
          - EventTriggerEventsRuleMediaConvertStatusUpdateRole
          - Arn
        Arn:
          Fn::GetAtt:
          - EventTriggerEventsRuleMediaConvertStatusUpdateApiDestination
          - Arn
        Id: Target0
    Metadata:
      aws:cdk:path: VodFoundation/EventTrigger/EventsRule/Resource
      AWS::CloudFormation::Designer:
        id: 2b198e53-3992-4886-9407-f6196d2a33e0
  EventTriggerEventsRuleMediaConvertStatusUpdateApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn:
        Fn::GetAtt:
        - EventTriggerEventsRuleMediaConvertStatusUpdateApiConnection
        - Arn
      HttpMethod: POST
      InvocationEndpoint:
        Ref: WebhookAuthorizationUrl
    Metadata:
      AWS::CloudFormation::Designer:
        id: 27c0a0f5-5492-4934-ac04-030f1a318d60
  EventTriggerEventsRuleMediaConvertStatusUpdateApiConnection:
    Type: AWS::Events::Connection
    Properties:
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: Authorization
          ApiKeyValue:
            Ref: WebhookAuthorizationKey
    Metadata:
      AWS::CloudFormation::Designer:
        id: 3ec0e7d1-7348-4538-9cf7-f98bf02d34fb
  CDKMetadata:
    Type: AWS::CDK::Metadata
    Properties:
      Analytics: v2:deflate64:
    Metadata:
      aws:cdk:path: VodFoundation/CDKMetadata/Default
      AWS::CloudFormation::Designer:
        id: c7907c47-051b-4fd6-8d19-a1dd703c8cff
    Condition: CDKMetadataAvailable
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      #AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W35
          reason: Logs bucket does not require logging configuration
        - id: W51
          reason: Logs bucket is private and does not require a bucket policy
      AWS::CloudFormation::Designer:
        id: 6d3320ff-2186-4770-a1e1-7c3492f5461d
  CloudfrontVideoDistributionOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Join:
          - ''
          - - Ref: AWS::StackName
            - "-OriginAccessControl"
        Description: Cloudfront access from Video CDN Distribution
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
    Metadata:
      AWS::CloudFormation::Designer:
        id: 6d021c73-ca33-4ef1-bf61-8fad623dcf0b
  EventTriggerEventsRuleMediaConvertStatusUpdateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - events.amazonaws.com
        Version: '2012-10-17'
      Path: "/service-role/"
      Policies:
      - PolicyName: eventbridge-api-destinations
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:InvokeApiDestination
            Resource:
              Fn::GetAtt:
              - EventTriggerEventsRuleMediaConvertStatusUpdateApiDestination
              - Arn
    Metadata:
      AWS::CloudFormation::Designer:
        id: 91087ccc-b4f6-4204-8899-bc3743e545cc
Outputs:
  SourceBucket:
    Description: Source S3 Bucket used to host source video and MediaConvert job settings
      files
    Value:
      Ref: SourceS3Bucket
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-SourceBucket"
  DestinationBucket:
    Description: Source S3 Bucket used to host all MediaConvert ouputs
    Value:
      Ref: DestinationS3Bucket
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-DestinationBucket"
  CloudFrontDomain:
    Description: CloudFront Domain Name
    Value:
      Fn::GetAtt:
      - CloudfrontVideoDistribution
      - DomainName
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-CloudFrontDomain"
  EventTriggerEventsRuleMediaConvertStatusUpdateApiConnection:
    Description: API Connection to send MediaConvert Status Updates
    Value:
      Ref: EventTriggerEventsRuleMediaConvertStatusUpdateApiConnection
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-ApiConnection"
  CloudfrontVideoDistributionOriginAccessControl:
    Description: Origin Access Control allowing CloudFront access to S3
    Value:
      Ref: CloudfrontVideoDistributionOriginAccessControl
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-OriginAccessControl"
  MediaConvertJobSettingsTemplate:
    Description: MediaConvert Job Template for Video Transformations
    Value:
      Ref: MediaConvertJobSettingsTemplate
    Export:
      Name:
        Fn::Join:
        - ''
        - - Ref: AWS::StackName
          - "-MediaConvertJobSettingsTemplate"
