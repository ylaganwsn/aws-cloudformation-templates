  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database instances security group
      GroupName: !Sub "${environment}-priv-01-sql"
      VpcId: !Ref VPC
      SecurityGroupIngress: 
        - SourceSecurityGroupId: !Ref Ec2InstanceLaunchTemplateSG
          FromPort: 3306
          IpProtocol: tcp
          ToPort: 3306
      SecurityGroupEgress: 
        - 
          CidrIp: 0.0.0.0/0
          IpProtocol: -1
      Tags:
        - Key: Name 
          Value: !Sub "${ProjectName}-${environment}-priv-01-sql"

  RDSDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet Group for mySQL database
      DBSubnetGroupName: !Sub "${AWS::Region}-${environment}-aws-dxl-database-subnet-group"
      SubnetIds: 
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # KMS RDS encryption key
  RDSKey:
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Version: 2012-10-17
        Id: key-rds
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Join
                - ''
                - - 'arn:aws:iam::'
                  - !Ref 'AWS::AccountId'
                  - ':root'
            Action: 'kms:*'
            Resource: '*'

  RDSDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${environment}"
      DBName: !Sub "${ProjectName}_${environment}"
      AllocatedStorage: 20
      DBInstanceClass: !Ref RDSInstance
      Engine: "MYSQL"
      MasterUsername: !Ref MasterUsername
      MasterUserPassword: !Sub "${ProjectName}^Random"
      BackupRetentionPeriod: 7
      MultiAZ: false
      EngineVersion: 8.0.35
      AutoMinorVersionUpgrade: true
      PubliclyAccessible: false
      StorageType: gp2
      Port: 3306
      CopyTagsToSnapshot: true
      EnableIAMDatabaseAuthentication: false
      EnablePerformanceInsights: false
      DeletionProtection: false
      DBSubnetGroupName: !Ref RDSDBSubnetGroup
      VPCSecurityGroups: 
        - !Ref RDSSecurityGroup
      MaxAllocatedStorage: 1000
      DBParameterGroupName: !Ref ParameterGroup
      StorageEncrypted: true
      KmsKeyId: !Ref RDSKey
      CACertificateIdentifier: rds-ca-ecc384-g1

Outputs:

  Name:
    Description: VPC Stack Name
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub ${AWS::StackName}-Name

  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcID"

  PublicSubnet1:
    Description: Public subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1ID"

  PublicSubnet2:
    Description: Public subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2ID"

  PrivateSubnet1:
    Description: Private subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1ID"

  PrivateSubnet2:
    Description: Private subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2ID"

  Ec2InstanceLaunchTemplate:
    Description: Ec2 Launch Template
    Value: !Ref Ec2InstanceLaunchTemplate
    Export:
      Name: !Sub "${AWS::StackName}-Ec2InstanceLaunchTemplate"

  Ec2InstanceAutoScalingGroup:
    Description: Ec2 Auto Scaling Group
    Value: !Ref Ec2InstanceAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-Ec2InstanceAutoScalingGroup"

  ProjBucket:
    Description: S3 Bucket Assets
    Value: !Ref ProjBucket
    Export:
      Name: !Sub "${AWS::StackName}-ProjBucket"