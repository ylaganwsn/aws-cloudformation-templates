          - Name: VUE_APP_API_URL
            Value: !Ref VueAppApiUrl
      TimeoutInMinutes: 300
      QueuedTimeoutInMinutes: 60
      ServiceRole: !Ref CodeBuildRole
      Artifacts:
        Type: S3
        Location: !Ref DeploymentsBucket
        OverrideArtifactName: true 
        Path: cms
        Packaging: ZIP
      LogsConfig:
        CloudWatchLogs: 
          Status: ENABLED

  CmsApplication:
    Type: AWS::CodeDeploy::Application
    Properties: 
      ApplicationName: !Sub "${ProjectName}-cms-${environment}"
      ComputePlatform: Server

  CmsDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      DeploymentGroupName: !Sub "${ProjectName}-${environment}-asg"
      ApplicationName: !Ref CmsApplication
      AutoScalingGroups:
        - Ref: Ec2InstanceAutoScalingGroup
      ServiceRoleArn:
        Fn::GetAtt:
        - CodeDeployIAMRole
        - Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      AutoRollbackConfiguration:
        Enabled: false

  CmsCodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-cms-${environment}"
      RoleArn: !GetAtt [CodePipelineRole, Arn]
      ArtifactStore:
        Location:
          Ref:
            DeploymentsBucket
        Type: S3
      Stages:
        - Name: Source
          Actions:
            - InputArtifacts: []
              Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: S3
              Namespace: SourceVariables
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                S3Bucket:
                  Ref: DeploymentsBucket
                S3ObjectKey: 
                  Ref: S3ObjectKeyZip
              RunOrder: 1
        - Name: Build
          Actions:
          - Name: Build
            ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
            Namespace: BuildVariables
            OutputArtifacts:
              - Name: BuildArtifact
            InputArtifacts:
              - Name: SourceArtifact
            Configuration:
                ProjectName: !Ref CmsCodeBuild
            RunOrder: 1
        - Name: Deploy
          Actions:
          - Name: Deploy
            ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: 1
                Provider: CodeDeploy
            Namespace: DeployVariables
            InputArtifacts:
              - Name: BuildArtifact
            Configuration:
                ApplicationName: !Ref CmsApplication
                DeploymentGroupName: !Ref CmsDeploymentGroup
            RunOrder: 1

