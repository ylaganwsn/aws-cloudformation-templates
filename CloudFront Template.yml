AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  Region:
    Type: String
    Default: ap-southeast-2
    AllowedValues:
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - us-west-2
      - us-west-1
      - us-east-2
      - us-east-1
      - ap-south-1
      - ap-northeast-2
      - ap-northeast-1
      - ap-southeast-2
      - ap-southeast-1
      - ca-central-1
      - sa-east-1
    Description: Enter the AWS region to deploy stack. Default is ap-southeast-2

  ALBDomain:
    Type: String
    Description: The domain name for the ALB e.g "x-x-x-x.us-west-2.elb.amazonaws.com"
    
  ALBId:
    Type: String
    Description: The ARN of the Application Load Balancer
   
  ParentStack:
    Description: Active CloudFormation stack containing VPC resources
    Type: String
    Default: Development
    MinLength: 1
    MaxLength: 255
    AllowedPattern: ^[a-zA-Z][-a-zA-Z0-9]*$

  ProjectName:
    Type: String
    Default: ProjectName

  environment:
    Description: Environment type of the project
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  AssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketName: !Sub ${ProjectName}-${environment}-asset
      Tags:
        - Key: env
          Value: !Sub ${environment}

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Default Origin Access Control
        Name: !Sub ${ProjectName}-${environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName}-${environment}-Distribution
        Enabled: 'true'
        Origins:
          - DomainName: !Sub ${ProjectName}-${environment}-asset.s3.${Region}.amazonaws.com
            # .s3.us-east-1.amazonaws.com
            # .s3.ap-southeast-2.amazonaws.com"
            Id: !Ref AssetBucket
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        HttpVersion: http2
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: !Ref AssetBucket
          ForwardedValues:
            QueryString: 'false'
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref DefaultCachePolicy
          Compress: true

  DefaultCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Sub ${ProjectName}-${environment}-CachePolicy-${AWS::StackName}
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  MyOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Comment: Managed-CachingDisabled Origin Request Policy
        Name: !Sub ${ProjectName}-${environment}-Custom-Managed-CachingDisabled
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: allViewer
        QueryStringsConfig:
          QueryStringBehavior: all

  MyCachePolicyId:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Managed-CachingDisabled Cache Policy
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        Name: !Sub ${ProjectName}-${environment}-Custom-Managed-CachingDisabled
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: false

  APICloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName}-${environment}-API
        Origins:
        - Id: !Ref ALBId
          DomainName: !Ref ALBDomain
          CustomOriginConfig:
            HTTPPort: 80
            HTTPSPort: 443
            OriginProtocolPolicy: http-only
        Enabled: true
        HttpVersion: http2
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - DELETE
            - OPTIONS
            - PATCH
            - POST
            - PUT
          TargetOriginId: !Ref ALBId
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref MyCachePolicyId
          OriginRequestPolicyId: !Ref MyOriginRequestPolicy
          Compress: true
          ForwardedValues:
            QueryString: false
        # Aliases:
        #   - !Ref DNSApi 

  CMSCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName}-${environment}-CMS
        Origins:
        - Id: !Ref ALBId
          DomainName: !Ref ALBDomain
          CustomOriginConfig:
            HTTPPort: 80
            HTTPSPort: 443
            OriginProtocolPolicy: http-only
        Enabled: true
        HttpVersion: http2
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - DELETE
            - OPTIONS
            - PATCH
            - POST
            - PUT
          TargetOriginId: !Ref ALBId
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref MyCachePolicyId
          OriginRequestPolicyId: !Ref MyOriginRequestPolicy
          Compress: true
          ForwardedValues:
            QueryString: false

  WEBCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName}-${environment}-WEB
        Origins:
          - Id: !Ref ALBId
            DomainName: !Ref ALBDomain
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        Enabled: true
        HttpVersion: http2
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - DELETE
            - OPTIONS
            - PATCH
            - POST
            - PUT
          TargetOriginId: !Ref ALBId
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref MyCachePolicyId
          OriginRequestPolicyId: !Ref MyOriginRequestPolicy
          Compress: true
          ForwardedValues:
            QueryString: false